name: Build & Release DMG

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS DMG
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
          xcode-select -p
          xcodebuild -version

      - name: Build DMG Package
        run: |
          chmod +x scripts/build_dmg.sh
          ./scripts/build_dmg.sh

      - name: Locate DMG File
        id: locate_dmg
        run: |
          DMG_FILE=$(find dist -name "*.dmg" | head -n 1)
          echo "DMG_PATH=${DMG_FILE}" >> $GITHUB_ENV
          echo "DMG_FILENAME=$(basename "$DMG_FILE")" >> $GITHUB_ENV
          echo "Found DMG: ${DMG_FILE}"

      - name: Upload DMG as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_FILENAME }}
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
